<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会の管理画面｜建築協約</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./admin.mjs"></script>
</head>
<body>
<header><p>小川１・２丁目地区環境を守る会</p><h1>建築協約の受付管理</h1><a href="./">受付ページ</a></header>
<main>
<output id="status" role="status"></output>
<section id="login-section">
<h2>会の担当者ログイン</h2>
<form method="post" id="login">
<label>メールアドレス<input name="email" type="email" autocomplete="username" required></label>
<label>パスワード<input name="password" type="password" autocomplete="current-password" required></label>
<button id="login-button" disabled>ログイン</button>
</form>
</section>
<div id="admin" hidden>
<section>
<div class="actions"><button id="refresh">一覧を更新</button><button id="logout">ログアウト</button></div>
<label>案件検索<input id="filter" placeholder="受付番号・氏名・住所・状態"></label>
<h2>受付一覧</h2>
<ul id="cases"></ul>
</section>
<section id="detail" hidden></section>
</div>
</main>
</body>
</html>
